<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programme - Paradox</title>
    <link rel="icon" type="image/webp" href="../media/paradox_logo.webp">
    <link rel="icon" type="image/png" href="../media/paradox_logo.png">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../programme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <a href="/paradox/"><h2>PARADOX</h2></a>
            </div>
            <ul class="nav-links">
                <li><a href="/paradox/">Accueil</a></li>
                <li><a href="/paradox/reglement/">Règlement</a></li>
                <li><a href="/paradox/carte/">Carte</a></li>
                <li><a href="/paradox/equipe/">Équipe</a></li>
                <li><a href="/paradox/boutique/">Boutique</a></li>
                <li><a href="/paradox/magazine/">Magazine</a></li>
                <li><a href="/paradox/programme/" class="active">Programme</a></li>
                <li><a href="https://w2g.tv/?r=dgdjw1shaeg6t09lxw" target="_blank" class="icon-link">
                    <picture>
                        <source srcset="../media/w2g_logo.webp" type="image/webp">
                        <img src="../media/w2g_logo.png" alt="Watch2Gether">
                    </picture>
                </a></li>
                <li><a href="https://discord.gg/9MaAJ3WnYC" target="_blank" class="icon-link"><i class="fab fa-discord"></i></a></li>
            </ul>
            <div class="burger">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="page-header">
            <h1>Notre Programme</h1>
            <p>Découvrez tous nos événements à venir</p>
        </section>

        <section class="calendar-section">
            <div class="calendar-header">
                <button id="prevMonth" class="nav-btn"><i class="fas fa-chevron-left"></i></button>
                <h2 id="currentMonth"></h2>
                <button id="nextMonth" class="nav-btn"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="calendar-grid" id="calendarGrid">
                <!-- Généré par JavaScript -->
            </div>
        </section>

        <!-- Modal pour afficher les détails de l'événement -->
        <div id="eventModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="eventTitle"></h2>
                <div id="eventDetails"></div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p><strong>Paradox</strong> &copy; <span id="current-year">2026</span> - Tous droits réservés.</p>
        </div>
    </footer>

    <script src="../programme.js"></script>
    <script src="../script.js"></script>
</body>
</html>
