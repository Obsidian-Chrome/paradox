<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paradox - Agence d'Artistes & Bar Événementiel</title>
    <link rel="icon" type="image/webp" href="media/paradox_logo.webp">
    <link rel="icon" type="image/png" href="media/paradox_logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-static">
        <div class="container">
            <div class="logo">
                <a href="/"><h2>PARADOX</h2></a>
            </div>
            <ul class="nav-links">
                <li><a href="/" class="active">Accueil</a></li>
                <li><a href="/reglement/">Règlement</a></li>
                <li><a href="/carte/">Carte</a></li>
                <li><a href="/equipe/">Équipe</a></li>
                <li><a href="/boutique/">Boutique</a></li>
                <li><a href="/magazine/">Magazine</a></li>
                <li><a href="/programme/">Programme</a></li>
                <li><a href="https://w2g.tv/?r=dgdjw1shaeg6t09lxw" target="_blank" class="icon-link">
                    <picture>
                        <source srcset="media/w2g_logo.webp" type="image/webp">
                        <img src="media/w2g_logo.png" alt="Watch2Gether">
                    </picture>
                </a></li>
                <li><a href="https://discord.gg/9MaAJ3WnYC" target="_blank" class="icon-link"><i class="fab fa-discord"></i></a></li>
            </ul>
            <div class="burger">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
        </div>
    </nav>

    <div class="hero-immersive">
        <div class="hero-background"></div>
        <div class="hero-content-wrapper">
            <div class="hero-main-content">
                <picture>
                    <source srcset="media/paradox_logo.webp" type="image/webp">
                    <img src="media/paradox_logo.png" alt="Paradox Logo" class="hero-immersive-logo">
                </picture>
                <p class="hero-immersive-subtitle">Agence d'Artistes & Bar Événementiel</p>
                <div class="hero-immersive-cta">
                    <a href="/programme/" class="cta-btn cta-primary">
                        <span>Événements</span>
                        <i class="fas fa-arrow-right"></i>
                    </a>
                    <a href="/equipe/" class="cta-btn cta-secondary">
                        <span>Notre Équipe</span>
                        <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            </div>
            <div class="hero-info-wrapper">
                <div class="hero-info-box">
                    <div class="hero-info-icon">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="hero-info-text">
                        <p><strong>Samedi (Mensuel)</strong></p>
                        <p>21h00 - 23h30</p>
                    </div>
                </div>
                <div class="hero-info-box">
                    <div class="hero-info-icon">
                        <i class="fas fa-map-marker-alt"></i>
                    </div>
                    <div class="hero-info-text">
                        <p>Moogle | La Coupe</p>
                        <p>Secteur 10, Maison 9</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <main class="main-content">
    </main>

    <footer>
        <div class="container">
            <p><strong>Paradox</strong> &copy; <span id="current-year">2026</span> - Tous droits réservés.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
