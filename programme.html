<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <a href="index.html"><img src="media/paradox_logo.png" alt="Paradox Logo"></a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Accueil</a></li>

            </ul>
            <div class="burger">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="page-header">
            <h1>Notre Programme</h1>
            <p>Découvrez tous nos événements à venir</p>
        </section>

        <section class="calendar-section">
            <div class="calendar-header">
                <button id="prevMonth" class="nav-btn"><i class="fas fa-chevron-left"></i></button>
                <h2 id="currentMonth"></h2>
                <button id="nextMonth" class="nav-btn"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="calendar-grid" id="calendarGrid">
                <!-- Généré par JavaScript -->
            </div>
        </section>

        <!-- Modal pour afficher les détails de l'événement -->
        <div id="eventModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="eventTitle"></h2>
                <div id="eventDetails"></div>
            </div>
        </div>
    </main>

    <footer>
