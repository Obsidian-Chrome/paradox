<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique - Paradox</title>
    <link rel="icon" type="image/webp" href="../media/paradox_logo.webp">
    <link rel="icon" type="image/png" href="../media/paradox_logo.png">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../carte.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .merch-controls {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 15px;
            margin-bottom: 3rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .search-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .search-bar input {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            background: var(--darker-bg);
            border: 2px solid transparent;
            border-radius: 10px;
            color: var(--light-text);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--primary-blue);
        }

        .search-bar button {
            padding: 12px 30px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-pink));
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-bar button:hover {
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }

        .filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filters label {
            color: var(--gray-text);
            font-weight: 600;
        }

        .filters select {
            padding: 10px 15px;
            background: var(--darker-bg);
            border: 2px solid transparent;
            border-radius: 10px;
            color: var(--light-text);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filters select:focus {
            outline: none;
            border-color: var(--primary-purple);
        }

        .merch-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .merch-item {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .merch-item:hover {
            box-shadow: 0 8px 25px rgba(155, 89, 182, 0.3);
        }

        .merch-preview {
            width: 100%;
            height: 400px;
            background: var(--darker-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .merch-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .merch-preview i {
            font-size: 4rem;
            color: var(--primary-purple);
        }

        .merch-tags {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(74, 144, 226, 0.8);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .merch-details {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .merch-details h3 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            color: var(--primary-blue);
        }

        .merch-meta {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            color: var(--gray-text);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .merch-meta span {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .modder {
            color: var(--primary-pink);
            font-weight: 600;
        }

        .file-size {
            color: var(--primary-purple);
        }

        .download-btn {
            margin-top: auto;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple));
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .download-btn:hover {
            box-shadow: 0 4px 12px rgba(155, 89, 182, 0.3);
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            color: var(--gray-text);
            font-size: 1.2rem;
        }

        .gender-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .gender-modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .modal-content h2 {
            color: var(--primary-blue);
            margin-bottom: 1rem;
            text-align: center;
        }

        .modal-content p {
            color: var(--gray-text);
            margin-bottom: 2rem;
            text-align: center;
        }

        .gender-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .gender-btn {
            flex: 1;
            min-width: 150px;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple));
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .gender-btn:hover {
            box-shadow: 0 5px 20px rgba(74, 144, 226, 0.4);
        }

        .gender-btn.cancel {
            background: linear-gradient(135deg, #666, #888);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <a href="/"><h2>PARADOX</h2></a>
            </div>
            <ul class="nav-links">
                <li><a href="/">Accueil</a></li>
                <li><a href="/reglement/">Règlement</a></li>
                <li><a href="/carte/">Carte</a></li>
                <li><a href="/equipe/">Équipe</a></li>
                <li><a href="/boutique/" class="active">Boutique</a></li>
                <li><a href="/magazine/">Magazine</a></li>
                <li><a href="/programme/">Programme</a></li>
                <li><a href="https://w2g.tv/?r=dgdjw1shaeg6t09lxw" target="_blank" class="icon-link">
                    <picture>
                        <source srcset="../media/w2g_logo.webp" type="image/webp">
                        <img src="../media/w2g_logo.png" alt="Watch2Gether">
                    </picture>
                </a></li>
                <li><a href="https://discord.gg/9MaAJ3WnYC" target="_blank" class="icon-link"><i class="fab fa-discord"></i></a></li>
            </ul>
            <div class="burger">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="page-header">
            <h1>Boutique Paradox</h1>
            <p>Téléchargez nos créations exclusives</p>
        </section>

        <section class="merch-controls">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Rechercher un item...">
                <button onclick="filterMerch()">Rechercher</button>
            </div>
            <div class="filters">
                <label>Trier par:</label>
                <select id="sortSelect" onchange="sortMerch()">
                    <option value="name">Nom (A-Z)</option>
                    <option value="name-desc">Nom (Z-A)</option>
                </select>

                <label>Compatibilité:</label>
                <select id="compatFilter" onchange="filterMerch()">
                    <option value="all">Toutes</option>
                    <option value="tbse">TBSE+</option>
                    <option value="yab">YAB</option>
                    <option value="rue">Rue</option>
                    <option value="bibo">Bibo</option>
                </select>
            </div>
        </section>

        <section id="merchContainer">
            <div class="merch-grid">
                <!-- Les items seront chargés depuis data/merch.json -->
            </div>
        </section>
    </main>

    <div class="gender-modal" id="genderModal">
        <div class="modal-content">
            <h2>Choisissez le modèle</h2>
            <p id="modalItemName"></p>
            <div class="gender-buttons">
                <button class="gender-btn" onclick="confirmDownload('masculin')">Masculin</button>
                <button class="gender-btn" onclick="confirmDownload('feminin')">Féminin</button>
                <button class="gender-btn cancel" onclick="closeGenderModal()">Annuler</button>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p><strong>Paradox</strong> &copy; <span id="current-year">2026</span> - Tous droits réservés.</p>
        </div>
    </footer>

    <script src="../script.js"></script>
    <script src="../merch.js"></script>
</body>
</html>
