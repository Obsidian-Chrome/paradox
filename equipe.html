    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .team-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            margin-top: 3rem;
            justify-content: center;
        }

        .team-member {
            width: 280px;
            flex-shrink: 0;
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .team-member:hover {
            box-shadow: 0 8px 25px rgba(74, 144, 226, 0.3);
        }

        .member-image {
            width: 100%;
            height: 300px;
            overflow: hidden;
            position: relative;
        }

        .member-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .member-role-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, #ff0000, #cc0000);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .member-role-badge a {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .member-role-badge a:hover {
            opacity: 0.8;
        }

        .member-info {
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .member-info h3 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--primary-blue);
            text-align: center;
        }

        .member-info .role {
            color: var(--primary-pink);
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .member-info .bio {
            color: var(--gray-text);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .member-social {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .member-social a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 35px;
            height: 35px;
            background: rgba(74, 144, 226, 0.2);
            border-radius: 50%;
            color: var(--primary-blue);
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .member-social a:hover {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-pink));
            color: white;
            transform: scale(1.1);
        }

        .section-divider {
            margin: 80px 0 40px;
            text-align: center;
        }

        .section-divider h2 {
            font-size: 2.5rem;
            color: var(--primary-purple);
            margin-bottom: 1rem;
        }
    </style>
</head>

                <li><a href="https://discord.gg/9MaAJ3WnYC" target="_blank" class="icon-link"><i class="fab fa-discord"></i></a></li>
            </ul>
            <div class="burger">

                <div class="line2"></div>

    <main class="container">
        <section class="page-header">
            <h1>Notre Équipe</h1>
